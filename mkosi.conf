[Build]
ToolsTreeDistribution=arch
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
UseSubvolumes=true
WithNetwork=true

[Output]
ImageId=customos
Format=directory
SplitArtifacts=true
ManifestFormat=json

[Distribution]
Distribution=arch

[Content]
Bootable=true
Bootloader=systemd-boot
UnifiedKernelImages=true
KernelModulesInitrd=true
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default

[Validation]
SecureBoot=false
SecureBootAutoEnroll=true
SecureBootSignTool=systemd-sbsign
# SecureBootKey=./mkosi.key
# SecureBootCertificate=./mkosi.crt

# SignExpectedPcr=true
# VerityKey=./mkosi.key
# VerityCertificate=./mkosi.crt

[Runtime]
TPM=true
