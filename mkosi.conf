[Build]
ToolsTreeDistribution=arch
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
UseSubvolumes=true
WithNetwork=true

[Output]
ImageId=customos
Format=disk
SplitArtifacts=true
ManifestFormat=json

[Distribution]
Distribution=arch

[Validation]
SecureBoot=false
SecureBootAutoEnroll=true
SecureBootSignTool=systemd-sbsign
# SecureBootKey=./mkosi.key
# SecureBootCertificate=./mkosi.crt

# SignExpectedPcr=true
# VerityKey=./mkosi.key
# VerityCertificate=./mkosi.crt

[Content]
Bootable=true
UnifiedKernelImages=auto
KernelCommandLine=rw lsm=landlock,lockdown,yama,integrity,apparmor,bpf nowatchdog quiet splash
KernelModulesInitrd=true
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default

[Runtime]
TPM=true
