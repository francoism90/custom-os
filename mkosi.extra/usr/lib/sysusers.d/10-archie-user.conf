# CustomOS default user configuration
# Syntax: type name id "GECOS" home shell
#
# u - create user
# g - create group
# m - add user to group
#
# Example: Create a user named 'archie' with default shell
u archie - "Archie" /home/archie /bin/fish

# Add user to common groups for desktop functionality
m archie wheel
m archie audio
m archie video
m archie optical
m archie storage
m archie scanner
m archie input
